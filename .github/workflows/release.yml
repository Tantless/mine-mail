name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check tag and project versions
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };

          const cargoVersion = (path) => {
            const text = fs.readFileSync(path, "utf8");
            const packageBlock = text.match(/\[package\]([\s\S]*?)(?=\r?\n\[|$)/)?.[1];
            return packageBlock?.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          };

          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
            fail(`Release tag "${tag}" must look like v1.2.3 or v1.2.3-beta.1.`);
          }

          const expected = tag.slice(1);
          const versions = {
            "Cargo.toml": cargoVersion("Cargo.toml"),
            "web/src-tauri/Cargo.toml": cargoVersion("web/src-tauri/Cargo.toml"),
            "web/src-tauri/tauri.conf.json": JSON.parse(
              fs.readFileSync("web/src-tauri/tauri.conf.json", "utf8")
            ).version,
          };

          for (const [path, version] of Object.entries(versions)) {
            if (version !== expected) {
              fail(`${path} has version "${version}", but the tag is "${tag}".`);
            }
          }

          console.log(`All project versions match ${tag}.`);
          NODE

  prepare-release:
    name: Prepare draft release
    needs: validate-version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Create draft release when needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; reusing it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mine Mail $GITHUB_REF_NAME" \
              --draft \
              --generate-notes
          fi

  build-release:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # tauri-action merges each platform into latest.json. The publish job
      # validates every required platform before making the draft public.
      max-parallel: 2
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            rust_targets: "aarch64-apple-darwin"
            apple_signing_identity: "-"
          - label: Linux x64
            platform: ubuntu-22.04
            args: "--bundles deb,appimage"
            rust_targets: ""
            apple_signing_identity: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./web/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Restore Gmail OAuth build configuration
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_JSON_BASE64: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_JSON_BASE64)) {
            throw "Repository secret GOOGLE_OAUTH_CLIENT_JSON_BASE64 is required for a release build."
          }
          $bytes = [Convert]::FromBase64String($env:GOOGLE_OAUTH_CLIENT_JSON_BASE64)
          $path = Join-Path $env:GITHUB_WORKSPACE "web/src-tauri/google-oauth-client.json"
          [IO.File]::WriteAllBytes($path, $bytes)

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: web
          tagName: ${{ github.ref_name }}
          releaseName: Mine Mail ${{ github.ref_name }}
          releaseBody: "Mine Mail installers for Windows 11 x64, macOS 14+ Apple Silicon, and Linux x64 (.deb or AppImage)."
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          retryAttempts: 3
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

  build-windows-release:
    name: Build Windows x64
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            installer/windows/package-lock.json

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./web/src-tauri -> target
            ./installer/windows/src-tauri -> target

      - name: Install Mine Mail frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install installer frontend dependencies
        working-directory: installer/windows
        run: npm ci

      - name: Test branded installer frontend
        working-directory: installer/windows
        run: npm test

      - name: Restore Gmail OAuth build configuration
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_JSON_BASE64: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_JSON_BASE64)) {
            throw "Repository secret GOOGLE_OAUTH_CLIENT_JSON_BASE64 is required for a release build."
          }
          $bytes = [Convert]::FromBase64String($env:GOOGLE_OAUTH_CLIENT_JSON_BASE64)
          $path = Join-Path $env:GITHUB_WORKSPACE "web/src-tauri/google-oauth-client.json"
          [IO.File]::WriteAllBytes($path, $bytes)

      - name: Build updater bundles and publish GitHub Release assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: web
          tagName: ${{ github.ref_name }}
          releaseName: Mine Mail ${{ github.ref_name }}
          releaseBody: "Mine Mail installers for Windows 11 x64, macOS 14+ Apple Silicon, and Linux x64 (.deb or AppImage)."
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          retryAttempts: 3
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: false
          args: "--bundles nsis"

      - name: Build branded setup executable
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $payload = Get-ChildItem `
            -LiteralPath "web/src-tauri/target/release/bundle/nsis" `
            -Filter "*-setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $payload) {
            throw "The internal NSIS payload was not produced."
          }

          & .\installer\windows\scripts\build-release.ps1 `
            -PayloadPath $payload.FullName `
            -Version $version

          $assetDirectory = "installer/windows/release-assets"

      - name: Upload branded Windows setup
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem `
            -LiteralPath "installer/windows/release-assets" `
            -File |
            ForEach-Object FullName
          if ($assets.Count -ne 1) {
            throw "Expected exactly one branded setup executable."
          }
          $arguments = @(
            "release",
            "upload",
            $env:GITHUB_REF_NAME
          ) + $assets + @(
            "--repo",
            $env:GITHUB_REPOSITORY,
            "--clobber"
          )
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Uploading Windows release assets failed."
          }

  publish-release:
    name: Publish complete release
    needs:
      - build-release
      - build-windows-release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Normalize and validate updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          manifest_dir="$(mktemp -d)"
          remote_manifest_dir="$(mktemp -d)"
          trap 'rm -rf "$manifest_dir" "$remote_manifest_dir"' EXIT
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$manifest_dir"
          release_id="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId \
              --jq ".databaseId"
          )"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            | jq -s "add" > "$manifest_dir/release-assets.json"
          node .github/scripts/normalize-updater-manifest.mjs \
            "$manifest_dir/latest.json" \
            "$manifest_dir/release-assets.json"
          node .github/scripts/validate-release-assets.mjs \
            "$manifest_dir/latest.json" \
            "$manifest_dir/release-assets.json"
          gh release upload "$RELEASE_TAG" \
            "$manifest_dir/latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$remote_manifest_dir"
          cmp "$manifest_dir/latest.json" "$remote_manifest_dir/latest.json"
          node .github/scripts/validate-release-assets.mjs \
            "$remote_manifest_dir/latest.json" \
            "$manifest_dir/release-assets.json"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
