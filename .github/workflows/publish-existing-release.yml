name: Publish existing draft release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag, for example v0.1.3
        required: true
        type: string
      confirm_publish:
        description: Validate and publish this draft release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-existing-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate and publish ${{ inputs.release_tag }}
    if: ${{ inputs.confirm_publish }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check release tag and draft state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag \"$RELEASE_TAG\" must look like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          is_draft="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq ".isDraft"
          )"
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG does not exist as a draft."
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Validate updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          manifest_dir="$(mktemp -d)"
          trap 'rm -rf "$manifest_dir"' EXIT

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$manifest_dir"
          release_id="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq ".id"
          )"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            | jq -s "add" > "$manifest_dir/release-assets.json"
          node - \
            "$manifest_dir/latest.json" \
            "$manifest_dir/release-assets.json" <<'NODE'
          const fs = require("node:fs");

          const path = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
          const releaseAssets = JSON.parse(
            fs.readFileSync(process.argv[3], "utf8")
          );
          const tauriConfig = JSON.parse(
            fs.readFileSync("web/src-tauri/tauri.conf.json", "utf8")
          );
          const tag = process.env.RELEASE_TAG;
          const expectedVersion = tag.replace(/^v/, "");
          const requiredPlatforms = [
            "darwin-aarch64",
            "darwin-x86_64",
            "linux-x86_64",
            "windows-x86_64",
          ];
          if (!Array.isArray(releaseAssets) || releaseAssets.length === 0) {
            throw new Error(`Release ${tag} has no downloadable assets.`);
          }
          const allowedAssetUrls = new Set(
            releaseAssets
              .flatMap((asset) => [asset.url, asset.browser_download_url])
              .filter(Boolean)
              .map((url) => new URL(url).href)
          );
          const minisignKeyId = (encodedEnvelope, label) => {
            const envelope = Buffer.from(
              String(encodedEnvelope).trim(),
              "base64"
            ).toString("utf8");
            const encodedPayload = envelope
              .split(/\r?\n/)
              .find(
                (line) =>
                  line &&
                  !line.startsWith("untrusted comment") &&
                  !line.startsWith("trusted comment")
              );
            if (!encodedPayload) {
              throw new Error(`${label} is not a valid minisign envelope.`);
            }
            const payload = Buffer.from(encodedPayload, "base64");
            if (payload.length < 10) {
              throw new Error(`${label} does not contain a minisign key id.`);
            }
            return payload.subarray(2, 10).toString("hex");
          };
          const embeddedKeyId = minisignKeyId(
            tauriConfig.plugins?.updater?.pubkey,
            "embedded updater public key"
          );

          if (String(manifest.version).replace(/^v/, "") !== expectedVersion) {
            throw new Error(
              `latest.json version ${manifest.version} does not match ${tag}.`
            );
          }

          for (const platform of requiredPlatforms) {
            const entry = manifest.platforms?.[platform];
            if (!entry?.url || !entry?.signature) {
              throw new Error(`latest.json is missing ${platform}.`);
            }
            const url = new URL(entry.url);
            if (url.protocol !== "https:" || !allowedAssetUrls.has(url.href)) {
              throw new Error(
                `${platform} update URL does not belong to release ${tag}.`
              );
            }
            const signatureKeyId = minisignKeyId(
              entry.signature,
              `${platform} updater signature`
            );
            if (signatureKeyId !== embeddedKeyId) {
              throw new Error(
                `${platform} updater signature does not match the embedded public key.`
              );
            }
          }

          console.log(`Validated signed updater metadata for ${tag}.`);
          NODE

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

          is_draft="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq ".isDraft"
          )"
          if [[ "$is_draft" != "false" ]]; then
            echo "::error::Release $RELEASE_TAG is still a draft."
            exit 1
          fi
          echo "Published release $RELEASE_TAG."
