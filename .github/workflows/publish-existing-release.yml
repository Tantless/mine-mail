name: Publish existing draft release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag, for example v0.1.3
        required: true
        type: string
      confirm_publish:
        description: Validate and publish this draft release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-existing-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate and publish ${{ inputs.release_tag }}
    if: ${{ inputs.confirm_publish }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check release tag and draft state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag \"$RELEASE_TAG\" must look like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          is_draft="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq ".isDraft"
          )"
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG does not exist as a draft."
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Validate updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          manifest_dir="$(mktemp -d)"
          trap 'rm -rf "$manifest_dir"' EXIT

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$manifest_dir"
          release_id="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId \
              --jq ".databaseId"
          )"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            | jq -s "add" > "$manifest_dir/release-assets.json"
          node .github/scripts/validate-release-assets.mjs \
            "$manifest_dir/latest.json" \
            "$manifest_dir/release-assets.json"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

          is_draft="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq ".isDraft"
          )"
          if [[ "$is_draft" != "false" ]]; then
            echo "::error::Release $RELEASE_TAG is still a draft."
            exit 1
          fi
          echo "Published release $RELEASE_TAG."
