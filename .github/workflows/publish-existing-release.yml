name: Publish existing draft release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag, for example v0.1.3
        required: true
        type: string
      confirm_publish:
        description: Validate and publish this draft release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-existing-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate and publish ${{ inputs.release_tag }}
    if: ${{ inputs.confirm_publish }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check release tag and draft state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag \"$RELEASE_TAG\" must look like v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi

          is_draft="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq ".isDraft"
          )"
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release $RELEASE_TAG does not exist as a draft."
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Consolidate and validate release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          manifest_dir="$(mktemp -d)"
          remote_manifest_dir="$(mktemp -d)"
          trap 'rm -rf "$manifest_dir" "$remote_manifest_dir"' EXIT
          version="${RELEASE_TAG#v}"
          branded_signature="Mine-Mail_${version}_x64-setup.exe.sig"
          internal_updater="Mine.Mail_${version}_x64-setup.exe"
          release_id="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId \
              --jq ".databaseId"
          )"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            | jq -s "add" > "$manifest_dir/release-assets.json"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$manifest_dir"
          consolidate_args=(
            "$manifest_dir/latest.json"
            "$manifest_dir/release-assets.json"
          )
          if jq -e --arg name "$branded_signature" \
            'any(.[]; .name == $name)' \
            "$manifest_dir/release-assets.json" >/dev/null; then
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$branded_signature" \
              --dir "$manifest_dir"
            consolidate_args+=("$manifest_dir/$branded_signature")
          fi
          node .github/scripts/consolidate-windows-updater.mjs \
            "${consolidate_args[@]}"
          node .github/scripts/normalize-updater-manifest.mjs \
            "$manifest_dir/latest.json" \
            "$manifest_dir/release-assets.json"
          jq --arg internal "$internal_updater" \
            --arg signature "$branded_signature" \
            '[.[] | select(.name != $internal and .name != $signature)]' \
            "$manifest_dir/release-assets.json" \
            > "$manifest_dir/public-release-assets.json"
          node .github/scripts/validate-release-assets.mjs \
            "$manifest_dir/latest.json" \
            "$manifest_dir/public-release-assets.json"
          gh release upload "$RELEASE_TAG" \
            "$manifest_dir/latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$remote_manifest_dir"
          cmp "$manifest_dir/latest.json" "$remote_manifest_dir/latest.json"
          node .github/scripts/validate-release-assets.mjs \
            "$remote_manifest_dir/latest.json" \
            "$manifest_dir/public-release-assets.json"
          for asset in "$internal_updater" "$branded_signature"; do
            if jq -e --arg name "$asset" \
              'any(.[]; .name == $name)' \
              "$manifest_dir/release-assets.json" >/dev/null; then
              gh release delete-asset "$RELEASE_TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            fi
          done
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            | jq -s "add" > "$manifest_dir/public-release-assets.json"
          node .github/scripts/validate-release-assets.mjs \
            "$remote_manifest_dir/latest.json" \
            "$manifest_dir/public-release-assets.json"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

          is_draft="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq ".isDraft"
          )"
          if [[ "$is_draft" != "false" ]]; then
            echo "::error::Release $RELEASE_TAG is still a draft."
            exit 1
          fi
          echo "Published release $RELEASE_TAG."
